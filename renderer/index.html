    <!--
      Arc reactor. Drag it by the outer rim; click the glowing core to talk,
      long-press it for the control panel, right-click to interrupt. All state
      (listening / thinking / acting / speaking / error) is shown through the
      reactor's colour and spin speed — there is no status text.

      #orb is the drag handle and tilts with the cursor (parallax). The RINGS
      inside it rotate, so the spin and the tilt never fight each other.
    -->
    <div id="orb" class="loader" title="Click the core or press ⌘⇧J to talk">
      <!-- Machined outer bezel with bolt notches (static housing) -->
      <div class="bezel"></div>
      <!-- Signature copper coil windings — the ring that visibly rotates -->
      <div class="coils"></div>
      <!-- Inner turbine spokes, counter-rotating for depth -->
      <div class="turbine"></div>
      <!-- Bright energy ring that separates the coils from the core -->
      <div class="ring"></div>
      <!-- Sweeping energy arc that orbits the core -->
      <div class="sweep"></div>
      <!-- Three dashed "gear" rings (the old reactor's signature) layered over
           the machined body: an outer, a middle counter-turning, and one around
           the core. Fixed cyan (#55eeef) so they read as glowing energy teeth. -->
      <div class="gear g1"></div>
      <div class="gear g4"></div>
      <div class="gear g2"></div>
      <div class="gear g3"></div>

    <!--
      Mark 50 skin. Built from the RENDERED model rather than redrawn in CSS —
      hand-tracing that geometry never matches, and the render is the real thing.

      Three stacked copies of the same image do the work:
        .m50-bloom-wide  a wide, soft copy that spills light onto the desktop
        .m50-art    the render itself, untouched
        .m50-bloom  the same render blown out and blurred, blended over the top

      That last layer is the trick: screen-blending a brightened blur of the
      artwork makes the ALREADY-BRIGHT parts (the core, the light bars) glow
      while the dark plating stays dark — so the glow follows the model's own
      shapes instead of being a circle stuck behind it. Its opacity rides
      --level, which is the live microphone level, so the core breathes.

      Only rendered when the skin is active; see hud.css.
    -->
    <div id="orb50" class="orb50" title="Click the core or press ⌘⇧J to talk" hidden>
      <img class="m50-bloom-wide" src="../assets/reactor-mark50.png" alt="" aria-hidden="true" draggable="false" />
      <img class="m50-art" src="../assets/reactor-mark50.png" alt="" draggable="false" />
      <img class="m50-bloom" src="../assets/reactor-mark50.png" alt="" aria-hidden="true" draggable="false" />
      <!--
        A layered skin splits the same render into concentric rings so they can
        turn independently. One flat image cannot spin: rotating it takes the
        core, the triangle and the etched labels round with it, which reads as
        the whole reactor tumbling rather than its rings turning. Hidden unless
        the current skin supplies layers; see hud.js.
      -->
      <img class="m50-layer m50-l-mid" alt="" aria-hidden="true" draggable="false" />
      <img class="m50-layer m50-l-outer" alt="" aria-hidden="true" draggable="false" />
      <img class="m50-layer m50-l-core" alt="" aria-hidden="true" draggable="false" />
      <!-- A second copy of the outer ring, brightened and revealed through a
           rotating wedge, so light runs around the segments one after another
           without any of them having to move. -->
      <img class="m50-layer m50-l-sweep" alt="" aria-hidden="true" draggable="false" />
      <!-- Invisible click target over the core. Everything outside it drags. -->
      <div class="m50-hit" title="Click to talk · long-press for controls · right-click to stop"></div>
    </div>
